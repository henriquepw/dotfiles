[bar.default]
background_opacity = 0.74999998323619366
end = [
    "cpu",
    "ram",
    "temp",
    "spacer_2",
    "tray",
    "notifications",
    "clipboard",
    "bluetooth",
    "volume",
    "control-center",
    "session"
]
font_family = "JetBrainsMono NF"
margin_edge = 0
margin_ends = 0
radius = 0
shadow = false
start = [ "launcher", "workspaces" ]

[dock]
auto_hide = true
background_opacity = 0.99999997764825821
enabled = true
reserve_space = false
show_dots = true
show_instance_count = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 1280.0
    cy = 1321.0
    output = "DP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_password_hint = true

[shell]
font_family = "JetBrainsMono NF"

[theme]
builtin = "Ayu"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"

[wallpaper]
directory = "/home/henrique/dotfiles/dotfiles"

    [wallpaper.default]
    path = "/home/henrique/dotfiles/dotfiles/wallpaper.png"

    [wallpaper.last]
    path = "/home/henrique/dotfiles/dotfiles/wallpaper.png"

[widget.media]
title_scroll = "always"

[widget.network]
show_label = false

[widget.spacer_2]
type = "spacer"

[widget.sysmon]
stat = "ram_used"
