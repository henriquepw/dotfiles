// LibreWolf overrides (applies to every profile). Goal: cap RAM usage.

// unload inactive tabs when system memory runs low
defaultPref("browser.tabs.unloadOnLowMemory", true);
defaultPref("browser.low_commit_space_threshold_percent", 25);

// fewer content processes: group sites instead of one process per site
defaultPref("dom.ipc.processCount", 4);
defaultPref("dom.ipc.processCount.webIsolated", 1);
defaultPref("fission.webContentIsolationStrategy", 0); // trades Spectre site isolation for RAM

// fewer cached pages for back/forward
defaultPref("browser.sessionhistory.max_total_viewers", 2);
