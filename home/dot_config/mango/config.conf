env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=SDL_VIDEODRIVER,wayland
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# autostart
exec_once=fcitx5
exec_once=noctalia
exec_once=hushmic --tray
exec_once=ghostty -e tmux new-session -A -s main
exec_once=brave-origin --app-id=cinhimbnkkaeohfgghhklpknlkffjgod
exec_once=zapfast
exec_once=steam
exec_once=flatpak run moe.sable.client

repeat_rate=25
repeat_delay=400
numlock_on=0
mouse_accel_profile=1
mouse_accel_speed=0.35
sloppy_focus=0
xkb_rules_layout=us
xkb_rules_variant=intl

border_px=2
border_radius=6
gap_inner_horizontal=6
gap_inner_vertical=6
gap_outer_horizontal=6
gap_outer_vertical=6
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

animations=1
layer_animations=1
animation_duration_move=400
animation_duration_open=300
animation_duration_tag=0
animation_duration_close=300
animation_duration_focus=0

blur_optimized=1
blur_params_num_passes=3
blur_params_radius=4
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.1

blur=1
blur_layer=0
shadows=0
layer_shadows=0

# TV no HDMI: desligada até o Mod+Alt+H ligar
monitor_rule=name:HDMI-A-1,disable:1

# layouts config
new_is_master=0
default_master_factor=0.60
default_master_count=1

scroller_default_proportion=0.7
scroller_focus_center=0
scroller_prefer_center=1

tag_num=5
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:scroller

# window rules
window_rule=tags:1,app_id:^com\.mitchellh\.ghostty$
window_rule=tags:4,app_id:^brave-.*-Default$,title:^(WhatsApp|Sable).*$
window_rule=tags:4,app_id:^(zapfast|sable).*$
window_rule=tags:5,app_id:^steam$
window_rule=scroller_proportion:0.20,app_id:^steam$,title:^Lista de amigos$
window_rule=is_named_scratchpad:1,is_open_silent:1,width:1225,height:936,app_id:^brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default$

# Floating Windows
window_rule=is_floating:1,width:1020,height:900,app_id:^dev\.noctalia\.Noctalia$
window_rule=is_floating:1,is_global:1,width:0.5,height:0.5,app_id:org.gnome.NautilusPreviewer
window_rule=is_floating:1,width:0.4,height:0.5,app_id:jetbrains-studio

window_rule=is_floating:1,is_global:1,width:480,height:270,offset_x:100,offset_y:100,app_id:^(librewolf|io\.gitlab\.librewolf-community)$,title:^Picture-in-Picture$
window_rule=is_floating:1,is_global:1,width:480,height:270,offset_x:100,offset_y:100,app_id:^(brave-.*|com\.brave\..*)$,title:^Picture in picture$

# keybinds
bind=Alt,r,reload_config
bind=SUPER,Return,spawn,noctalia msg panel-toggle launcher
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

bind=SUPER+SHIFT,h,resizewin,-50,0
bind=SUPER+SHIFT,l,resizewin,+50,0

bind=SUPER+SHIFT,t,spawn,ghostty -e tmux new-session -A -s main
bind=SUPER+SHIFT+ALT,t,spawn,ghostty
bind=SUPER+SHIFT,f,spawn,nautilus
bind=SUPER+SHIFT,b,spawn,brave-origin
bind=SUPER+SHIFT+ALT,b,spawn,brave-origin --private
bind=SUPER+SHIFT,s,spawn,steam
bind=SUPER+SHIFT,m,toggle_named_scratchpad,^brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default$,none,brave-origin --app-id=cinhimbnkkaeohfgghhklpknlkffjgod
bind=SUPER+SHIFT,d,spawn,flatpak run moe.sable.client
bind=SUPER+SHIFT,g,spawn,zapfast

bind=SUPER+ALT,h,spawn,toggle-tv

bind=SUPER,n,togglefloating,
bind=SUPER+SHIFT,w,killclient,
bind=SUPER,BackSpace,togglemaximizescreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER+CTRL,m,togglefullscreen,
bind=SUPER,o,toggleoverview,

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER,Left,move_client,left
bind=SUPER,Down,move_client,down
bind=SUPER,Up,move_client,up
bind=SUPER,Right,move_client,right

bind=SUPER+CTRL,h,tagmon,left
bind=SUPER+CTRL,j,tagmon,down
bind=SUPER+CTRL,k,tagmon,up
bind=SUPER+CTRL,l,tagmon,right

bind=SUPER,p,spawn,noctalia msg screenshot-region
bind=SUPER+SHIFT,p,spawn,noctalia msg annotate

bind=SUPER,1,tag,1
bind=SUPER,2,tag,2
bind=SUPER,3,tag,3
bind=SUPER,4,tag,4
bind=SUPER,5,tag,5
bind=SUPER,6,tag,6

bind=SUPER,q,view,1
bind=SUPER,w,view,2
bind=SUPER,e,view,3
bind=SUPER,r,view,4
bind=SUPER,t,view,5
bind=SUPER,y,view,6

bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

drag_corner=4
drag_warp_cursor=0
mousebind=SUPER,btn_left,moveresize,curresize
mousebind=SUPER,btn_right,moveresize,curmove

source=~/.config/mango/tangerina.conf
