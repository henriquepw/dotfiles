env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=SDL_VIDEODRIVER,wayland
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# autostart
exec-once=fcitx5
exec-once=noctalia
exec-once=hushmic --tray
exec-once=ghostty -e tmux new-session -A -s main
exec-once=brave-origin --app-id=cinhimbnkkaeohfgghhklpknlkffjgod
exec-once=zapfast
exec-once=steam
exec-once=flatpak run moe.sable.client

repeat_rate=25
repeat_delay=400
numlockon=0
mouse_accel_profile=1
mouse_accel_speed=0.35
sloppyfocus=0
xkb_rules_layout=us
xkb_rules_variant=intl

borderpx=2
border_radius=6
gappih=4
gappiv=4
gappoh=4
gappov=4
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=3
blur_params_radius=3
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.1

shadows=0
layer_shadows=0

# TV no HDMI: desligada até o Mod+Alt+H ligar
monitorrule=name:HDMI-A-1,disable:1

tag_num=5
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:scroller

# window rules
windowrule=isfloating:1,width:1020,height:900,appid:^dev\.noctalia\.Noctalia$
windowrule=tags:1,appid:^com\.mitchellh\.ghostty$
windowrule=tags:4,appid:^brave-.*-Default$,title:^(WhatsApp|Sable).*$
windowrule=tags:5,appid:^steam$
windowrule=tags:4,appid:^(zapfast|sable).*$
windowrule=isnamedscratchpad:1,isopensilent:1,width:1225,height:936,appid:^brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default$

# keybinds
bind=Alt,r,reload_config
bind=SUPER,Return,spawn,noctalia msg panel-toggle launcher
bind=SUPER,Escape,spawn,noctalia msg panel-toggle session
bind=SUPER,s,spawn,noctalia msg panel-toggle control-center
bind=SUPER,comma,spawn,noctalia msg settings-toggle

bind=SUPER+SHIFT,t,spawn,ghostty -e tmux new-session -A -s main
bind=SUPER+SHIFT+ALT,t,spawn,ghostty
bind=SUPER+SHIFT,f,spawn,nautilus
bind=SUPER+SHIFT,b,spawn,brave-origin
bind=SUPER+SHIFT+ALT,b,spawn,brave-origin --private
bind=SUPER+SHIFT,s,spawn,steam
bind=SUPER+SHIFT,m,toggle_named_scratchpad,^brave-cinhimbnkkaeohfgghhklpknlkffjgod-Default$,none,brave-origin --app-id=cinhimbnkkaeohfgghhklpknlkffjgod
bind=SUPER+SHIFT,d,spawn,flatpak run moe.sable.client
bind=SUPER+SHIFT,g,spawn,zapfast

bind=SUPER+ALT,h,spawn,toggle-tv

bind=SUPER,n,togglefloating,
bind=SUPER+SHIFT,w,killclient,
bind=SUPER,BackSpace,togglemaximizescreen,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER+CTRL,m,togglefullscreen,
bind=SUPER,o,toggleoverview,

bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right

bind=SUPER,Left,move_client,left
bind=SUPER,Down,move_client,down
bind=SUPER,Up,move_client,up
bind=SUPER,Right,move_client,right

bind=SUPER+CTRL,h,tagmon,left
bind=SUPER+CTRL,j,tagmon,down
bind=SUPER+CTRL,k,tagmon,up
bind=SUPER+CTRL,l,tagmon,right

bind=SUPER,p,spawn,noctalia msg screenshot-region
bind=SUPER+SHIFT,p,spawn,noctalia msg annotate

bind=SUPER,1,tag,1
bind=SUPER,2,tag,2
bind=SUPER,3,tag,3
bind=SUPER,4,tag,4
bind=SUPER,5,tag,5
bind=SUPER,6,tag,6

bind=SUPER,q,view,1
bind=SUPER,w,view,2
bind=SUPER,e,view,3
bind=SUPER,r,view,4
bind=SUPER,t,view,5
bind=SUPER,y,view,6

bindl=NONE,XF86AudioRaiseVolume,spawn,noctalia msg volume-up
bindl=NONE,XF86AudioLowerVolume,spawn,noctalia msg volume-down
bindl=NONE,XF86AudioMute,spawn,noctalia msg volume-mute
bindl=NONE,XF86MonBrightnessUp,spawn,noctalia msg brightness-up
bindl=NONE,XF86MonBrightnessDown,spawn,noctalia msg brightness-down

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

drag_corner=4
drag_warp_cursor=0
mousebind=SUPER,btn_left,moveresize,curresize
mousebind=SUPER,btn_right,moveresize,curmove

