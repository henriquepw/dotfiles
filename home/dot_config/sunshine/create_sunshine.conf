capture = wlr
encoder = vaapi
gamepad = switch

# name of the virtual output lazypad creates, from the "[wlgrab] Monitor N is"
# log lines. Sunshine matches it by name: an index only works in the first probe
# and the stream falls back to monitor 0 (DP-2)
output_name = STREAM

# AMD VAAPI overshoots the frame budget on scene changes, which Moonlight reports as a slow connection
vaapi_strict_rc_buffer = enabled

# TVs advertise AV1 but decode it poorly; HEVC is the reliable path here
av1_mode = 1
