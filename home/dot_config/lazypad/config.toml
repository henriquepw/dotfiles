# each [modes.<name>] is entered with its combo (or `lazypad toggle <name>`) and
# left with the same combo, going back to the desktop

[gamepad]
vendors = [
  0x2dc8, # 8BitDo
  0x057e, # Sunshine virtual gamepad
]

[gamepad.mangohud]
combo = ["BTN_SELECT", "BTN_THUMBR"]
hold = "0.5s"

[gamepad.fps_limit]
combo = ["BTN_SELECT", "BTN_THUMBL"]
hold = "0.5s"

# apps closed when entering any mode
[close]
processes = ["zapfast"]
flatpaks = ["moe.sable.client"]

[modes.bed]
combo = ["BTN_SELECT", "BTN_START"]
hold = "1.5s"
exit_on_tv_off = true
gamescope = [
  "-e",
  "-f",
  "-W",
  "3840",
  "-H",
  "2160",
  "-r",
  "120",
  "--hdr-enabled",
  "--adaptive-sync",
]

[modes.bed.display]
type = "hdmi"
output = "HDMI-A-1"
disable = ["DP-2"]

[modes.bed.tv]
type = "adb"
addr = "192.168.1.182:5555"
mac = "08:9b:27:12:26:54"
input = "com.tcl.tvinput/.TvPassThroughService/HW15" # HDMI 1
wake_timeout = "20s"

[modes.bed.audio]
card = "alsa_card.pci-0000_09_00.1"
profile = "output:hdmi-stereo-extra3"
sink = "alsa_output.pci-0000_09_00.1.hdmi-stereo-extra3"

[modes.couch]
combo = ["BTN_THUMBL", "BTN_THUMBR"]
hold = "1.5s"
gamescope = ["-e", "-f", "-W", "3840", "-H", "2160", "-r", "60"]

# captured by Sunshine; its resolution comes from the monitor_rule in mango
[modes.couch.display]
type = "virtual"
output = "STREAM"

[modes.couch.tv]
type = "appletv"
addr = "192.168.1.100"
app = "com.moonlight-stream.Moonlight"
# opens the host and starts Steam; the delays give Moonlight time to find the PC
remote = ["delay=3000", "select", "delay=4000", "select"]
wake_timeout = "20s"
