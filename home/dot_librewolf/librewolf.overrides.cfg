// LibreWolf overrides (applies to every profile). Goal: keep RAM in check without hurting responsiveness.

// unload inactive tabs only when system memory is actually low (default threshold is 5%)
defaultPref("browser.tabs.unloadOnLowMemory", true);
defaultPref("browser.low_commit_space_threshold_percent", 10);

// slightly fewer content processes than the default (8); site isolation stays on
defaultPref("dom.ipc.processCount", 6);

// cap back/forward cache (default is auto, up to 8 pages)
defaultPref("browser.sessionhistory.max_total_viewers", 4);
