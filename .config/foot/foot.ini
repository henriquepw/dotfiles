[main]
# Keep the Omarchy theme source; the remaining defaults come from the NixOS setup.
include=~/.local/state/omarchy/current/theme/foot.ini
term=foot
shell=/usr/bin/zsh
font=JetBrainsMono Nerd Font:size=10
pad=8x4
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Shift+c Control+Insert XF86Copy
clipboard-paste=Control+Shift+v Shift+Insert XF86Paste
primary-paste=none

[text-bindings]
\x1b[13;2u=Shift+Return
\x1b[13;4u=Mod1+Shift+Return
