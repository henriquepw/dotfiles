# Application bindings
bindd = SUPER SHIFT, T, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus-webapp Music "https://music.youtube.com/"
bindd = SUPER SHIFT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
unbind = SUPER, RETURN
bindd = SUPER, RETURN, Omarchy menu, exec, omarchy-menu

# Close windows
bindd = SUPER SHIFT, W, Close window, killactive,

# Switch workspaces
unbind = SUPER, Q
unbind = SUPER, W
unbind = SUPER, E
unbind = SUPER, R
unbind = SUPER, T
bindd = SUPER, Q, Switch to workspace 1, workspace, 1
bindd = SUPER, W, Switch to workspace 2, workspace, 2
bindd = SUPER, E, Switch to workspace 3, workspace, 3
bindd = SUPER, R, Switch to workspace 4, workspace, 4
bindd = SUPER, T, Switch to workspace 5, workspace, 5

# Move active window to a workspace
bindd = SUPER, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SUPER, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SUPER, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SUPER, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SUPER, code:14, Move window to workspace 5, movetoworkspace, 5

unbind = SUPER, A
bindd = SUPER, A, Universal cut, sendshortcut, CTRL, A,


# Unbind the old PRINT key commands to avoid any conflicts
unbind = , PRINT
unbind = SHIFT, PRINT
unbind = CTRL, PRINT
unbind = ALT, PRINT
unbind = CTRL ALT, PRINT
unbind = SUPER, PRINT

# Screenshots and Recordings with SUPER + GRAVE (`)
bindd = SUPER SHIFT, S, Screenshot of region, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenshot
bindd = SUPER ALT, s, Screen record a region, exec, ~/.local/share/omarchy/bin/omarchy-cmd-screenrecord

# Color picker moved to a dedicated, non-conflicting key
bindd = SUPER SHIFT, C, Color picker, exec, pkill hyprpicker || hyprpicker -a
